{% load static %}
<link rel="stylesheet" href="{% static 'css/game_inicio.css' %}">
    

<section class="game-intro">
    <div class="intro-overlay"></div>

    <div class="intro-content">
        <h1 class="game-title">
            <span>D</span>
            <span>R</span>
            <span>A</span>
            <span>K</span>
            <span>O</span>
            <span>S</span>
        </h1>

        <h1 class="game-title">
            <span>S</span>
            <span>P</span>
            <span>E</span>
            <span>E</span>
            <span>D</span>
        </h1>

        <section class="video-section">
            <div class="video-wrapper">
                <video id="intro-video" muted playsinline preload="auto">
                    <source src="{% static 'Jogo/videos/Logo_Animada_De_Moeda_Pronta.mp4' %}" type="video/mp4">
                </video>

                <div class="video-overlay"></div>
                <div class="scroll-indicator">Role para começar</div>
            </div>
        </section>

        <button class="start-button">INICIAR</button>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="{% static 'js/game_inicio.js' %}"></script>
