{% load static %}

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

<header class="cabecalho">
  <a class="logo" href="{% url "home" %}">
    <img src="{% static "img/icones/Escudo_Drakos.png" %}" alt="escudo do drakos">
    <h1>DRAKOS FC</h1>
  </a>



  <!-- Ações do topo (mobile) -->

<div class="acoes-mobile">

<button id="botao_hamburguer"
        class="hamb-btn only-mobile"
        type="button"
        aria-expanded="false"
        aria-controls="menuNav">
    <i class="bx bx-menu"></i>
</button>

<a href="{% url 'carrinho' %}" class="icon-btn carrinho-mobile">
    <i class="bx bx-cart"></i>
</a>

</div>



  <!-- NAV (desktop e drawer mobile) -->
  <div class="nav" id="menuNav">
    <div class="drawer">
      <!-- Topo do drawer (somente mobile) -->
       
      <div class="drawer-top">

        <span class="drawer-title">MENU</span>
        
        <button type="button"
                class="hamb-close"
                id="fechar_menu"
                aria-label="Fechar menu">
          <i class="bx bx-x"></i>

        </button>

      </div>

      

      <ul class="hamburguer-opcoes">
        {% if request.session.cliente_id %}
          <li class="opcao-nav">
            <a href="{% url 'logout' %}"><i class="bx bx-log-out"></i> Sair</a>
          </li>
        {% else %}
          <li class="opcao-nav">
            <a href="{% url 'login' %}"><i class="bx bx-user"></i> Login</a>
          </li>
        {% endif %}
          

          <li class="opcao-nav">
            <a href="{% url 'menu_fases' %}">
              <i class="bx bx-joystick"></i> Game
            </a>
          </li>
          
          
        <li class="opcao-nav">
          <a href="{% url 'produtos' %}"><i class="bx bx-store"></i> Loja</a>
        </li>
        <li class="opcao-nav">
          <a href="{% url 'historia' %}"><i class="bx bx-book"></i> História</a>
        </li>
        <li class="opcao-nav">
          <a href="{% url 'ingresso' %}"><i class="fa-solid fa-ticket-alt"></i> Ingressos</a>
        </li>
        <li class="opcao-nav">
          <a href="{% url 'socio' %}"><i class="bx bx-crown"></i> Sócios</a>
        </li>
        <li class="opcao-nav">
          <a href="{% url "perfil" %}"><i class="bx bx-user-circle"></i> Perfil</a>
        </li>


        <li class="opcao-nav carrinho-desktop">
          <a href="{% url 'carrinho' %}">
            <i class="bx bx-cart"></i> Carrinho
          </a>
      </li>



      </ul>


    </div>
  </div>


<!-- Link App Mobile download -->
  <div class="app-mobile">
    <div class="app-mobile-text">
      <h3>Baixe o App Drakos FC</h3>
      <p>Fique por dentro de tudo que acontece no Drakos FC</p>
      <a href="{% url 'app_mobile' %}" class="btn-primary">Baixar App</a>
  </div>
</header>

<!-- Overlay do drawer (somente mobile) -->
<div class="menu-overlay" id="menuOverlay"></div>
