<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Acesso negado</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at top, #8c0000 0%, #3f0000 35%, #111 100%);

      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 700px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* =========================
       STICKMAN
    ========================= */

    .stickman {
      position: relative;

      width: 180px;
      height: 250px;

      margin-bottom: 35px;
    }

    /* cabeça */
    .head {
      position: absolute;

      top: 0;
      left: 50%;

      width: 95px;
      height: 95px;

      transform: translateX(-50%);

      border: 7px solid #fff;
      border-radius: 50%;
    }

    /* olhos */
    .eye {
      position: absolute;

      top: 34px;

      width: 8px;
      height: 8px;

      background: #fff;
      border-radius: 50%;
    }

    .eye.left {
      left: 25px;
    }

    .eye.right {
      right: 25px;
    }

    /* boca */
    .mouth {
      position: absolute;

      bottom: 18px;
      left: 50%;

      width: 30px;
      height: 5px;

      transform: translateX(-50%);

      background: #fff;
      border-radius: 10px;
    }

    /* corpo */
    .body-line {
      position: absolute;

      top: 92px;
      left: 50%;

      width: 7px;
      height: 90px;

      transform: translateX(-50%);

      background: #fff;
      border-radius: 10px;
    }

    /* braços */
    .arm {
      position: absolute;

      top: 120px;

      width: 70px;
      height: 7px;

      background: #fff;
      border-radius: 10px;
    }

    .arm.left {
      left: 23px;
      transform: rotate(35deg);
      transform-origin: right center;
    }

    .arm.right {
      right: 23px;
      transform: rotate(-35deg);
      transform-origin: left center;
    }

    /* pernas */
    .leg {
      position: absolute;

      top: 175px;

      width: 75px;
      height: 7px;

      background: #fff;
      border-radius: 10px;
    }

    .leg.left {
      left: 25px;
      transform: rotate(-58deg);
      transform-origin: right center;
    }

    .leg.right {
      right: 25px;
      transform: rotate(58deg);
      transform-origin: left center;
    }

    /* =========================
       ICONE DE BLOQUEIO
    ========================= */

    .block-icon {
      position: absolute;

      top: 65px;
      right: -10px;

      width: 55px;
      height: 55px;

      border: 5px solid #ff3b3b;
      border-radius: 50%;
    }

    .block-icon::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      width: 45px;
      height: 5px;

      background: #ff3b3b;

      transform:
        translate(-50%, -50%)
        rotate(-45deg);

      border-radius: 10px;
    }

    /* =========================
       TEXTO
    ========================= */

    .error-code {
      color: #ff3b3b;

      font-size: 1rem;
      font-weight: bold;

      letter-spacing: 3px;

      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);

      margin-bottom: 14px;

      text-transform: uppercase;

      letter-spacing: 1px;
    }

    p {
      max-width: 520px;

      font-size: 1.05rem;

      line-height: 1.6;

      color: rgba(255,255,255,0.72);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .stickman {
        transform: scale(0.85);

        margin-bottom: 15px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <main>

    <div class="stickman">

      <div class="head">
        <span class="eye left"></span>
        <span class="eye right"></span>
        <span class="mouth"></span>
      </div>

      <div class="body-line"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="block-icon"></div>

    </div>

    <span class="error-code">ERRO 403</span>

    <h1>Acesso negado</h1>

    <p>
      Você não tem permissão para visualizar esta página.
    </p>

  </main>

</body>
</html>
